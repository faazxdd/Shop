<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self' 'sha256-p7xaUTbWED71Z4WMLqQY/PD6h7haah2ESFDOETyjNEI=' 'sha256-Tno34nmtodZGO9ksjpBleRXOyIX3eBgB5p7Dfxq5Fjs=' 'sha256-E1NOlwZWGvBLtpbCF7YUHM2/XrRM7TcYr/D9eoq+ZBs='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://gcmudhejegesvwdpkkdy.supabase.co wss://gcmudhejegesvwdpkkdy.supabase.co https://commons.wikimedia.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FZ Cart | Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#171717">
  <link rel="manifest" href="admin-manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin-design.css">
</head>
<body class="admin-body">
<a href="#tab-content" class="skip-link">Skip to dashboard</a>

  <!-- Login -->
  <div class="login-wrap" id="login-view" hidden>
    <form class="card login-card" id="login-form">
      <div class="brand-mark"><img src="icons/logo.png" alt="" width="84" height="36"></div>
      <h1 style="text-align:center;margin-bottom:4px">FZ Cart Admin</h1>
      <p class="muted center small" style="margin-bottom:18px">Staff only. Use the email and password for your shop account.</p>
      <label class="field"><span>Email</span><input class="input" name="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>

  <!-- App shell -->
  <div id="app-view" hidden>
    <header class="admin-top">
      <span class="brand-mini"><img src="icons/logo.png" alt="" width="52" height="22"></span><strong id="top-title">Admin</strong>
      <span class="spacer"></span>
      <button class="order-sound" id="order-sound" type="button" role="switch" aria-checked="false" aria-label="New order sound">Sound<span aria-hidden="true"></span></button>
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch light or dark theme"><i class="i i-moon"></i><i class="i i-sun"></i></button>
      <button class="btn btn-sm" id="signout">Sign out</button>
    </header>
    <nav class="admin-nav" id="nav" aria-label="Admin sections"></nav>
    <main class="admin-main" id="tab-content"></main>
  </div>

  <script src="vendor/supabase-2.110.1.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script>
    /* ---------- Tab registry: other admin-*.js files add tabs with Tabs.push({...}) ---------- */
    const Tabs = [];
    let currentTab = null;

    function showTab(key) {
      const tab = Tabs.find(t => t.key === key) || Tabs[0];
      currentTab = tab.key;
      $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.key === tab.key));
      $('#top-title').textContent = tab.label;
      const el = $('#tab-content');
      el.innerHTML = '';
      Promise.resolve(tab.render(el)).catch(err => { console.error(err); el.innerHTML = `<div class="empty">${esc(errMsg(err))}</div>`; });
    }

    function buildNav() {
      Tabs.sort((a, b) => a.order - b.order);
      $('#nav').innerHTML = Tabs.map(t =>
        `<button data-key="${t.key}"><span class="ico">${t.ico}</span>${esc(t.label)}${t.key === 'orders' ? '<span class="nav-badge" id="orders-badge" hidden></span>' : ''}</button>`).join('');
      $('#nav').onclick = e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.key); };
    }

    /* =========================== DASHBOARD =========================== */
    Tabs.push({
      key: 'dashboard', order: 1, label: 'Dashboard', ico: '<i class="i i-chart"></i>',
      async render(el) {
        el.innerHTML = '<div class="stats"><div class="skeleton" style="min-height:80px"></div><div class="skeleton" style="min-height:80px"></div></div>';
        const [s,sales] = await Promise.all([Admin.summary(),sb.rpc('admin_sales_summary').then(throwIfError)]);
        const stat = (label, value, cls = '') => `<div class="card stat ${cls}"><div class="label">${esc(label)}</div><div class="value">${value}</div></div>`;
        const hr = new Date().getHours();
        const hello = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
        const pending = Number(s.orders_pending) || 0;
        const parts = [
          ['pending', 'Pending', s.orders_pending, 'var(--saffron)'],
          ['confirmed', 'Confirmed or processing', s.orders_confirmed, 'var(--emerald)'],
          ['completed', 'Completed', s.orders_completed, 'var(--ink)'],
          ['cancelled', 'Cancelled or rejected', s.orders_cancelled, 'var(--coral)']
        ].map(([k, l, n, c]) => [k, l, Number(n) || 0, c]);
        const sum = parts.reduce((t, p) => t + p[2], 0);
        el.innerHTML = `
          <section class="dash-hello">
            <div>
              <h2>${hello}</h2>
              <p>${pending ? `${pending} order${pending === 1 ? '' : 's'} waiting for you to accept.` : 'No orders waiting. You are all caught up.'}</p>
            </div>
            <div class="row wrap">
              <button class="btn" data-go="orders">${pending ? 'Review orders' : 'View orders'}</button>
              <button class="btn" data-go="products">Manage products</button>
            </div>
          </section>

          <h3 class="dash-group">Orders</h3>
          <div class="card flat">
            ${sum ? `<div class="pipeline" role="img" aria-label="Orders by status">${parts.map(p => p[2] ? `<i class="p-${p[0]}" style="flex:${p[2]}" title="${esc(p[1])}: ${p[2]}"></i>` : '').join('')}</div>` : '<p class="muted" style="margin:0">No orders yet.</p>'}
            <div class="legend">${parts.map(p => `<span style="--c:${p[3]}">${esc(p[1])} <strong>${p[2]}</strong></span>`).join('')}</div>
          </div>

          <h3 class="dash-group">Completed sales · all time</h3>
          <div class="stats">${stat('Revenue (excluding delivery)',money(sales.revenue))}${stat('Gross profit',sales.unknown_cost_items?'Incomplete':money(sales.profit))}${stat('Delivery collected',money(sales.delivery))}${stat('Completed orders',sales.orders)}</div>
          ${sales.unknown_cost_items?'<p class="help">Some legacy orders have no purchase-cost snapshot. See Reports for details.</p>':''}
          <h3 class="dash-group">Stock value</h3>
          <div class="stats two">
            ${stat('Potential gross profit', money(s.potential_profit), 'big')}
            ${stat('Selling value', money(s.selling_value))}
            ${stat('Purchase value', money(s.purchase_value))}
          </div>

          <h3 class="dash-group">Inventory</h3>
          <div class="stats">
            ${stat('Products', s.total_products)}
            ${stat('Units in stock', s.total_stock)}
            ${stat('Low stock', s.low_stock, s.low_stock ? 'warn' : '')}
            ${stat('Out of stock', s.out_of_stock, s.out_of_stock ? 'bad' : '')}
          </div>`;
        el.onclick = ev => { const b = ev.target.closest('[data-go]'); if (b) showTab(b.dataset.go); };
      }
    });

    /* =========================== PRODUCTS =========================== */
    Tabs.push({
      key: 'products', order: 2, label: 'Products', ico: '<i class="i i-box"></i>',
      async render(el) {
        el.innerHTML = `
          <div class="toolbar">
            <input class="input" id="p-search" type="search" placeholder="Search name, SKU, brand">
            <select class="input" id="p-status"><option value="">All status</option><option>published</option><option>draft</option><option>archived</option></select>
            <select class="input" id="p-stock"><option value="">All stock</option><option value="low">Low stock</option><option value="out">Out of stock</option></select>
            <button class="btn btn-primary" id="p-add"><i class="i i-plus"></i> Add product</button>
          </div>
          <div class="toolbar" id="p-bulk">
            <label><input type="checkbox" id="p-all"> Select all shown</label>
            <span id="p-count">0 selected</span>
            <button class="btn" id="p-archive">Archive selected</button>
            <button class="btn" id="p-delete">Delete selected</button>
          </div><div id="p-result" role="status"></div>
          <div id="p-list"></div>`;
        const list = $('#p-list');
        let busy = false;
        const pending = new Map();
        const stockFloor = p => Number(p.reserved_quantity || 0);
        const quickControls = p => `
          <div class="row wrap" style="gap:6px;margin-top:8px">
            <div class="row" style="gap:4px" role="group" aria-label="Stock for ${esc(p.name)}">
              <button type="button" class="btn btn-sm" style="min-width:44px;min-height:44px" data-stock-step="out" aria-label="Remove one from stock" ${p.quantity <= stockFloor(p) ? 'disabled' : ''}>−</button>
              <output style="min-width:2ch;text-align:center" aria-label="Stock on hand">${p.quantity}</output>
              <button type="button" class="btn btn-sm" style="min-width:44px;min-height:44px" data-stock-step="in" aria-label="Add one to stock">+</button>
              <button type="button" class="btn btn-sm" style="min-height:44px" data-stock-step="in" data-quantity="10" aria-label="Add ten to stock">+10</button>
            </div>
            ${p.status !== 'archived' ? `<button type="button" class="btn btn-sm" style="min-height:44px" data-quick-status>${p.status === 'published' ? 'Set draft' : 'Publish'}</button>` : ''}
          </div>`;
        const selected = () => [...list.querySelectorAll('[data-select]:checked')].map(x => x.value);
        function sync() {
          const boxes = [...list.querySelectorAll('[data-select]')], n = selected().length;
          $('#p-count').textContent = n + ' selected';
          $('#p-all').checked = boxes.length > 0 && n === boxes.length;
          $('#p-all').indeterminate = n > 0 && n < boxes.length;
          $('#p-archive').disabled = $('#p-delete').disabled = busy || !!pending.size || !n;
        }
        $('#p-all').onchange = e => { list.querySelectorAll('[data-select]').forEach(x => x.checked = e.target.checked); sync(); };
        list.onchange = sync;
        async function bulk(archive) {
          if (busy || pending.size) return;
          const ids = selected(); if (!ids.length) return;
          if (!confirm(`${archive ? 'Archive' : 'Permanently delete'} ${ids.length} selected products? ${archive ? 'They will disappear from the shop.' : 'Products with linked history may be blocked. This cannot be undone.'}`)) return;
          if (!archive && prompt('Type DELETE to confirm permanent deletion') !== 'DELETE') return;
          busy = true; sync();
          let ok = 0; const failures = [];
          for (const id of ids) {
            try { if (archive) await Admin.archiveProduct(id); else await Admin.deleteProduct(id); ok++; }
            catch (err) { failures.push((list._rows?.[id]?.name || id) + ': ' + errMsg(err)); }
          }
          busy = false;
          await load();
          $('#p-result').textContent = `${ok} ${archive ? 'archived' : 'deleted'}, ${failures.length} failed. ` + failures.join(' | ');
        }
        $('#p-archive').onclick = () => bulk(true);
        $('#p-delete').onclick = () => bulk(false);


        function productBadges(p) {
          return `${productStatusBadge(p.status)}${p.reserved_quantity ? `<span class="badge">${p.reserved_quantity} reserved</span>` : ''}`;
        }

        function queueQuickChange(card, product, step, quantity = 1) {
          const id = product.id;
          const next = (pending.get(id) || Promise.resolve()).then(async () => {
            try {
              if (step) {
                await Admin.stockMove(id, step, quantity, 'Products list quick adjustment');
              } else {
                const status = product.status === 'published' ? 'draft' : 'published';
                const result = throwIfError(await sb.from('products').update({status})
                  .eq('id', id).eq('status', product.status).select('status').maybeSingle());
                if (!result) throw new Error('Product status changed. Refresh Products and try again.');
                product.status = result.status;
              }
              if (step) {
                const result = throwIfError(await sb.from('products')
                  .select('quantity,reserved_quantity').eq('id', id).single());
                Object.assign(product, result);
              }
              if (card.isConnected) {
                card.querySelector('[data-product-badges]').innerHTML = productBadges(product);
                const controls = card.querySelector('[data-quick-controls]');
                controls.querySelector('output').textContent = product.quantity;
                controls.querySelector('[data-stock-step="out"]').disabled = product.quantity <= stockFloor(product);
                const statusButton = controls.querySelector('[data-quick-status]');
                if (statusButton) statusButton.textContent = product.status === 'published' ? 'Set draft' : 'Publish';
              }
            } catch (err) {
              toast(errMsg(err), 'error');
            }
          });
          pending.set(id, next);
          sync();
          next.finally(() => {
            if (pending.get(id) !== next) return;
            pending.delete(id);
            if (!card.isConnected) {
              if (list.isConnected && !pending.size) load();
              return;
            }
            const statusButton = card.querySelector('[data-quick-status]');
            if (statusButton) statusButton.disabled = false;
            sync();
          });
        }

        async function load() {
          list.innerHTML = '<div class="skeleton"></div>';
          try {
            const rows = await Admin.products({ search: $('#p-search').value, status: $('#p-status').value, stock: $('#p-stock').value });
            list.innerHTML = rows.length ? rows.map(p => `
              <div class="card list-card" data-id="${esc(p.id)}">
                <input type="checkbox" data-select value="${esc(p.id)}" aria-label="Select ${esc(p.name)}">
                ${p.images?.[0] ? `<img class="thumb-sm" src="${esc(p.images[0])}" alt="" loading="lazy">` : '<div class="thumb-sm thumb-empty" style="font-size:1.2rem"><i class="i i-camera"></i></div>'}
                <div class="grow">
                  <div class="title">${esc(p.name)}</div>
                  <div class="muted small">${esc(p.sku || 'No SKU')} &middot; ${esc(p.categories?.name || 'No category')}</div>
                  <div class="small">${money(p.selling_price)} <span class="muted">(cost ${money(p.purchase_price)})</span></div>
                  <div data-product-badges class="row wrap" style="gap:6px;margin-top:4px">
                    ${productBadges(p)}
                  </div>
                  <div data-quick-controls>${quickControls(p)}</div>
                </div>
                <div class="stack" style="min-width:76px">
                  <button class="btn btn-sm" data-stock>Stock</button>
                  <button class="btn btn-sm" data-edit>Edit</button>
                </div>
              </div>`).join('') : '<div class="empty"><div class="big"><i class="i i-box"></i></div>No products found.</div>';
            list._rows = Object.fromEntries(rows.map(p => [p.id, p])); sync();
          } catch (err) { list.innerHTML = `<div class="empty">${esc(errMsg(err))}</div>`; }
        }

        list.onclick = e => {
          const card = e.target.closest('.list-card'); if (!card) return;
          const p = list._rows[card.dataset.id];
          if (busy || !p) return;
          const step = e.target.closest('[data-stock-step]');
          const statusButton = e.target.closest('[data-quick-status]');
          if (step) queueQuickChange(card, p, step.dataset.stockStep, Number(step.dataset.quantity || 1));
          else if (statusButton) {
            statusButton.disabled = true;
            queueQuickChange(card, p);
          } else if (!pending.has(p.id)) {
            if (e.target.closest('[data-edit]')) productForm(p, load);
            else if (e.target.closest('[data-stock]')) stockForm(p, load);
          }
        };
        $('#p-add').onclick = () => productForm(null, load);
        $('#p-search').oninput = debounce(load, 350);
        $('#p-status').onchange = load;
        $('#p-stock').onchange = load;
        load();
      }
    });

    async function productForm(p, reload) {
      const isNew = !p;
      p = p || { images: [], status: 'draft', min_stock_alert: 5 };
      let images = [...(p.images || [])];
      const original = [...images];
      let cats = [];
      try { cats = await Admin.categories(); } catch (e) { console.error(e); }

      const body = openSheet(isNew ? 'Add product' : 'Edit product', `
        <form id="pf" novalidate>
          <div class="form-grid">
            <label class="field full"><span>Product name *</span><input class="input" name="name" maxlength="160" value="${esc(p.name)}" required></label>
            <label class="field"><span>SKU / Barcode</span><input class="input" name="sku" maxlength="64" value="${esc(p.sku)}"></label>
            <label class="field"><span>Brand</span><input class="input" name="brand" maxlength="80" value="${esc(p.brand)}"></label>
            <label class="field"><span>Category</span><select class="input" name="category_id"><option value="">None</option>
              ${cats.map(c => `<option value="${esc(c.id)}" ${c.id === p.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
            <label class="field"><span>Status</span><select class="input" name="status">
              ${['draft', 'published', 'archived'].map(s => `<option ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
              <div class="help">Only "published" products show to customers.</div></label>
            <label class="field"><span>Purchase price</span><input class="input" name="purchase_price" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(p.purchase_price ?? 0)}"></label>
            <label class="field"><span>Selling price</span><input class="input" name="selling_price" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(p.selling_price ?? 0)}"></label>
            <label class="field"><span>Original price (optional)</span><input class="input" name="compare_at_price" type="number" min="0" step="0.01" value="${esc(p.compare_at_price)}"></label>
            <label class="field"><span>Variant group (shared across SKUs)</span><input class="input" name="variant_group" maxlength="100" value="${esc(p.variant_group)}"></label>
            <label class="field full"><span>Variant attributes (one per line, e.g. Colour: Black)</span><textarea class="input" name="attributes">${esc(Object.entries(p.attributes||{}).map(([k,v])=>k+': '+v).join('\n'))}</textarea><small>Each variant is a separate product with its own price and inventory. Use the same group name to link them.</small></label>
            <label class="field"><span>Minimum stock alert</span><input class="input" name="min_stock_alert" type="number" inputmode="numeric" min="0" step="1" value="${esc(p.min_stock_alert)}"></label>
            ${isNew ? '<label class="field"><span>Initial quantity</span><input class="input" name="initial_qty" type="number" inputmode="numeric" min="0" step="1" value="0"></label>' : ''}
            <label class="field full"><span>Description</span><textarea class="input" name="description" maxlength="4000">${esc(p.description)}</textarea></label>
          </div>
          <div class="field"><span>Photos</span>
            <div class="image-grid" id="imgs"></div>
            <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
            <div class="row wrap"><input class="input" id="image-url" type="url" placeholder="HTTPS image URL"><button type="button" class="btn btn-sm" id="add-url">Add URL</button><button type="button" class="btn btn-sm" id="find-img">Find images</button></div><p class="help">Search public-domain images, review their source, then approve. Photos are published only when you save the product.</p><button type="button" class="btn btn-sm" id="addimg"><i class="i i-plus"></i> Add photos</button>
          </div>
          <div class="row" style="justify-content:space-between;margin-top:8px">
            ${isNew ? '<span></span>' : '<button type="button" class="btn btn-danger" id="del">Delete</button>'}
            <button class="btn btn-primary" type="submit" id="save">Save</button>
          </div>
        </form>`);

      const grid = $('#imgs', body);
      function drawImgs() {
        grid.innerHTML = images.map((u, i) => `<div class="image-tile"><img src="${esc(u)}" alt=""><button type="button" class="image-first" data-first="${i}" aria-label="Make primary photo">1st</button><button type="button" data-rm="${i}" aria-label="Remove photo"><i class="i i-close"></i></button></div>`).join('');
      }
      drawImgs();
      grid.onclick = e => { const first=e.target.closest('[data-first]');if(first){images.unshift(images.splice(Number(first.dataset.first),1)[0]);drawImgs();return} const b = e.target.closest('[data-rm]'); if (b) { images.splice(Number(b.dataset.rm), 1); drawImgs(); } };
      $('#find-img', body).onclick=()=>{const f=$('#pf',body).elements;const query=[f.brand.value,f.name.value,f.sku.value].filter(Boolean).join(' ');if(!query.trim())return toast('Enter product name first','error');let host=$('#image-candidates',body);if(!host){host=document.createElement('div');host.id='image-candidates';$('#imgs',body).after(host)}findLicensedImages(query,host,url=>{if(!images.includes(url))images.push(url);drawImgs()})};
      $('#add-url',body).onclick=()=>{try{const u=new URL($('#image-url',body).value.trim());if(u.protocol!=='https:')throw Error();if(!images.includes(u.href))images.push(u.href);drawImgs();$('#image-url',body).value=''}catch{toast('Enter a valid HTTPS image URL','error')}};
      $('#addimg', body).onclick = () => $('#file', body).click();
      $('#file', body).onchange = async e => {
        const btn = $('#addimg', body);
        await withBusy(btn, async () => {
          for (const f of e.target.files) {
            try { images.push(await Admin.uploadImage(f)); drawImgs(); } catch (err) { toast(errMsg(err), 'error'); }
          }
        });
        e.target.value = '';
      };

      const form = $('#pf', body);
      form.onsubmit = async ev => {
        ev.preventDefault();
        const f = form.elements;
        if (!form.reportValidity()) return;
        if (!f.name.value.trim()) return toast('Product name is required', 'error');
        await withBusy($('#save', body), async () => {
          try {
            const saved = await Admin.saveProduct({
              id: p.id, name: f.name.value, sku: f.sku.value, brand: f.brand.value, category_id: f.category_id.value,
              compare_at_price:f.compare_at_price.value,variant_group:f.variant_group.value,attributes:parseAttributes(f.attributes.value),
              status: f.status.value, purchase_price: f.purchase_price.value, selling_price: f.selling_price.value,
              initial_quantity:isNew?Number(f.initial_qty.value):0,min_stock_alert: f.min_stock_alert.value, description: f.description.value, images
            });
            // Unlink only: URLs may be shared with other products; retain storage objects.
            toast('Product saved', 'success'); closeSheet(); reload();
          } catch (err) {
            toast(/duplicate key|sku/i.test(errMsg(err)) ? 'That SKU is already used' : errMsg(err), 'error');
          }
        });
      };

      const del = $('#del', body);
      if (del) del.onclick = async () => {
        if (!(await confirmDialog(`Delete "${p.name}"? This cannot be undone.`, 'Delete', true))) return;
        try {
          await Admin.deleteProduct(p.id);
          closeSheet();
          toast('Product deleted', 'success'); reload();
        } catch (err) { toast(errMsg(err), 'error'); }
      };
    }

    function stockForm(p, reload) {
      const body = openSheet('Stock: ' + p.name, `
        <p class="muted">On hand: <strong>${p.quantity}</strong> &middot; Reserved for open orders: <strong>${p.reserved_quantity}</strong></p>
        <form id="sf">
          <label class="field"><span>Action</span><select class="input" name="type">
            <option value="in">Stock in (add)</option><option value="out">Stock out (remove)</option><option value="adjust">Adjust (set exact quantity)</option></select></label>
          <label class="field"><span>Quantity</span><input class="input" name="qty" type="number" inputmode="numeric" min="0" step="1" required></label>
          <label class="field"><span>Reason / note</span><input class="input" name="reason" maxlength="300" placeholder="e.g. New delivery, damaged, recount"></label>
          <button class="btn btn-primary btn-block" type="submit" id="ssave">Save stock change</button>
        </form>`);
      $('#sf', body).onsubmit = async ev => {
        ev.preventDefault();
        const f = ev.target.elements;
        const qty = parseInt(f.qty.value, 10);
        if (Number.isNaN(qty) || qty < 0) return toast('Enter a valid quantity', 'error');
        await withBusy($('#ssave', body), async () => {
          try { await Admin.stockMove(p.id, f.type.value, qty, f.reason.value); toast('Stock updated', 'success'); closeSheet(); reload(); }
          catch (err) { toast(errMsg(err), 'error'); }
        });
      };
    }
  </script>

  <script src="admin-reports.js"></script>
  <script src="admin-settings.js"></script>
  <script src="admin-commerce.js"></script>

  <script>
    /* ---------- Boot: decide login vs app ---------- */
    async function boot() {
      if (SUPABASE_URL.includes('YOUR-PROJECT-REF')) {
        document.body.innerHTML = '<div class="empty"><div class="big"><i class="i i-gear"></i></div>Setup needed: add your Supabase URL and anon key in <strong>supabase.js</strong>.</div>';
        return;
      }
      const ok = await Auth.requireAdmin();
      $('#login-view').hidden = ok;
      $('#app-view').hidden = !ok;
      if (ok) {
        buildNav(); showTab(location.hash.slice(1) || 'dashboard');
        (window.onAdminReady || []).forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
      }
    }

    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      const f = e.target.elements;
      await withBusy($('button[type=submit]', e.target), async () => {
        try { await Auth.signIn(f.email.value.trim(), f.password.value); f.password.value = ''; boot(); }
        catch (err) { toast(errMsg(err), 'error'); }
      });
    };
    $('#signout').onclick = async () => { await Auth.signOut(); location.reload(); };
    sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){closeSheet();$('#tab-content').replaceChildren();$('#app-view').hidden=true;$('#login-view').hidden=false;sb.removeAllChannels()}});
    boot();
  </script>
</body>
