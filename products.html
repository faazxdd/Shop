<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self' 'sha256-+QAAkKm+e8WPzHczpjgZBTCdLyKb8VxqUe9N4ZlUQhI=' 'sha256-jJaVag99QTjb0/QDnGzmWfZmZOUvfpcTr4lXQ7mOf1Y='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://gcmudhejegesvwdpkkdy.supabase.co wss://gcmudhejegesvwdpkkdy.supabase.co https://commons.wikimedia.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Products | FZ Cart</title>
<meta name="description" content="Browse FZ Cart products, compare AED prices, choose variants and place your order.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>try{document.documentElement.dataset.shopTheme=localStorage.getItem("shop-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<link rel="stylesheet" href="shop.css?v=glass-photo-zoom">
<link rel="canonical" href="https://faazxdd.github.io/Shop/products.html">
<meta property="og:title" content="FZ Cart">
<meta property="og:type" content="website">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="shell">
<div id="util"></div>
<header id="site-header"></header>
<main id="main-content" class="main" style="gap:18px">
<div class="page-h"><div class="sub" id="p-sub">Catalogue</div><h1 id="p-title">All products</h1></div>
<div class="catalog-tools">
<div class="bar catalog-search">
  <form id="sf" role="search" style="display:flex;gap:8px;flex:1;min-width:240px;max-width:460px"><input class="in" id="q" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off" maxlength="80"><button class="btn dark" type="submit">Search</button></form>
  <select class="in" id="sort" aria-label="Sort" style="width:auto"><option value="name">Name A to Z</option><option value="price_asc">Price low to high</option><option value="price_desc">Price high to low</option></select>
</div>
<details class="catalog-filters"><summary>Filters</summary>
<form id="filters" class="bar" aria-label="Product filters"><label class="field">Brand<select id="brand-filter" class="in"><option value="">All brands</option></select></label><label class="field">Minimum AED<input id="min-price" class="in" type="number" min="0" step="0.01"></label><label class="field">Maximum AED<input id="max-price" class="in" type="number" min="0" step="0.01"></label><label><input id="in-stock" type="checkbox"> In stock only</label><button class="btn" type="submit">Apply filters</button><button class="btn" type="reset">Clear</button></form>
</details>
</div>
<div class="chips" id="cats" aria-label="Categories"></div>
<div id="count" class="small muted"></div>
<div class="grid" id="products" aria-live="polite"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<div style="text-align:center"><button class="btn" id="more" hidden>Load more</button></div>
</main>
<footer id="site-footer"></footer>
</div>
<script src="vendor/supabase-2.110.1.js"></script>
<script src="supabase.js?v=cart-audit-fixes"></script>
<script src="motion.js?v=cart-race-fix"></script><script src="shop.js?v=glass-photo-zoom"></script>
<script>
const P=new URLSearchParams(location.search),PAGE=24;
const st={q:(P.get('q')||'').slice(0,80),cat:P.get('cat')||'',brand:(P.get('brand')||'').slice(0,160),sort:['price_asc','price_desc'].includes(P.get('sort'))?P.get('sort'):'name',saved:P.get('saved')==='1',off:0};
renderSiteHeader(st.saved?'saved':'shop');
const grid=$('#products');let shown=0,requestId=0;
$('#q').value=st.q;$('#sort').value=st.sort;if(P.get('focus'))setTimeout(()=>$('#q').focus(),50);
if(st.saved){$('#p-title').textContent='Saved products';$('#p-sub').textContent='Your list'}
const brandFilter=$('#brand-filter');
if(st.brand){brandFilter.add(new Option(st.brand,st.brand));brandFilter.value=st.brand;brandFilter.closest('details').open=true;}
Shop.brands().then(brands=>{
  const active=brandFilter.value;
  brandFilter.replaceChildren(new Option('All brands',''));
  for(const brand of new Set([...brands,...(active?[active]:[])]))brandFilter.add(new Option(brand,brand));
  brandFilter.value=active;
}).catch(console.error);
function filters(){return {brand:st.brand,minPrice:$('#min-price').value,maxPrice:$('#max-price').value,inStock:$('#in-stock').checked}}
$('#filters').onsubmit=e=>{e.preventDefault();st.brand=brandFilter.value;sync();fetchPage(true)};$('#filters').onreset=()=>setTimeout(()=>{brandFilter.value='';st.brand='';sync();fetchPage(true)});
function sync(){const u=new URLSearchParams();if(st.q)u.set('q',st.q);if(st.cat)u.set('cat',st.cat);if(st.brand)u.set('brand',st.brand);if(st.sort!=='name')u.set('sort',st.sort);if(st.saved)u.set('saved','1');history.replaceState(null,'',location.pathname+(u.toString()?'?'+u:''))}
async function fetchPage(reset){
const request=++requestId;
if(reset){st.off=0;shown=0;grid.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';$('#more').hidden=true}
try{let rows;
if(st.saved){const ids=Shop.favs.get();rows=ids.length?await Shop.products({ids,limit:100,...filters(),sort:st.sort,search:st.q,categoryId:st.cat}):[]}
else rows=await Shop.products({...filters(),search:st.q,categoryId:st.cat,sort:st.sort,limit:PAGE,offset:st.off});
if(request!==requestId)return;
if(reset)grid.innerHTML='';
if(!rows.length&&reset)grid.innerHTML=st.saved&&!Shop.favs.get().length?emptyHtml('heart','Nothing saved yet','Tap the heart on any product to keep it here.','<a class="btn dark" href="products.html">Browse products</a>'):emptyHtml('search','No products found','Try a different search or category.');
else grid.insertAdjacentHTML('beforeend',rows.map(productCardHtml).join(''));
shown+=rows.length;st.off+=rows.length;$('#count').textContent=shown?shown+' product'+(shown===1?'':'s')+' shown':'';
$('#more').hidden=st.saved||rows.length<PAGE}
catch(err){if(request!==requestId)return;console.error(err);if(reset)grid.innerHTML=emptyHtml('alert','Could not load products','Refresh the page to try again.')}}
function drawCats(cats){$('#cats').innerHTML=[{id:'',name:'All'},...cats].map(c=>`<button class="chip ${st.cat===c.id?'on':''}" data-c="${esc(c.id)}">${esc(c.name)}</button>`).join('')}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;st.cat=b.dataset.c;$$('#cats .chip').forEach(x=>x.classList.toggle('on',x===b));sync();fetchPage(true)});
$('#sf').addEventListener('submit',e=>{e.preventDefault();st.q=$('#q').value.trim();sync();fetchPage(true)});
$('#sort').addEventListener('change',e=>{st.sort=e.target.value;sync();fetchPage(true)});
$('#more').addEventListener('click',e=>withBusy(e.currentTarget,()=>fetchPage(false)));
applyBusinessSettings();
Shop.categories().then(drawCats).catch(console.error);
window.addEventListener('favs-changed',()=>{
  if(!st.saved)return;
  const saved=new Set(Shop.favs.get());
  if(!saved.size){fetchPage(true);return}
  for(const card of grid.querySelectorAll('.pc')){
    if(!saved.has(card.querySelector('[data-fav]').dataset.fav)){card.remove();shown--}
  }
  $('#count').textContent=shown?shown+' product'+(shown===1?'':'s')+' shown':'';
  if(!shown)fetchPage(true);
});
fetchPage(true);
if(P.get("product"))openProduct(P.get("product"));
</script>
</body>
</html>
