<script>
renderSiteHeader('cart');
const box=$('#cart');let lines=[],renderVersion=0,submitting=false,refreshing=false,draft=null,coupon='',quote=null,pendingCartEdits=0;
const lineHtml=l=>{const p=l.product,im=(p.images||[])[0],o=stockOf(p)==='out';
return `<div class="cl" data-id="${esc(l.product_id)}">${im?`<img src="${esc(im)}" alt="${esc(p.name)}">`:`<div class="ph">${ic('box')}</div>`}<div class="info"><b>${esc(p.name)}</b><span class="small muted">${money(p.selling_price)} each</span>${o?'<div class="small" style="color:var(--bad);font-weight:600">Out of stock. Remove it to continue.</div>':''}<br><button type="button" class="rm" data-rm>Remove</button></div><div style="text-align:right"><div class="qty"><button type="button" data-q="-1" aria-label="Less">${ic('minus')}</button><span>${l.quantity}</span><button type="button" data-q="1" aria-label="More" ${o||l.quantity>=cartLimit(p.id)?'disabled':''}>${ic('plus')}</button></div><div class="price" style="margin-top:6px">${money(l.quantity*Number(p.selling_price))}</div></div></div>`};
function captureDraft(){const f=$('#co');if(f)draft={...readDelivery(f.elements),name:f.elements.name.value,phone:f.elements.phone.value};}
async function render(){
const version=++renderVersion;captureDraft();refreshing=true;if($('#co-btn'))$('#co-btn').disabled=true;
let items=Shop.cart.get();
if(!items.length){box.innerHTML=emptyHtml('bag','Your cart is empty','Add something you like and it will wait here.','<a class="btn dark" href="products.html">Browse products</a>');return}
try{const next=await Shop.cartDetails();if(version!==renderVersion)return;lines=next}catch(e){if(version!==renderVersion)return;console.error(e);box.innerHTML=emptyHtml('alert','Could not load your cart','Please try again.','<button class="btn" id="retry-cart">Retry</button>');return}
if(!lines.length){Shop.cart.clear();box.innerHTML=emptyHtml('bag','Your cart is empty','The products in it are no longer available.','<a class="btn dark" href="products.html">Browse products</a>');return}
let pricingError='';try{quote=await Shop.quote(coupon)}catch(e){pricingError=errMsg(e);quote=null}if(version!==renderVersion)return;
let session;
try { session=await Auth.getSession(); }
catch(error) {
 if(version!==renderVersion)return;
 box.innerHTML=emptyHtml('alert','Could not check your sign-in','Please try again.','<button class="btn" id="retry-cart">Retry</button>');return;
}
if(version!==renderVersion)return;
captureDraft();
const missing=items.length!==lines.length;
const total=lines.reduce((s,l)=>s+l.quantity*Number(l.product.selling_price),0),blocked=!!pricingError||missing||lines.some(l=>stockOf(l.product)==='out');
refreshing=false;
const cartItems=lines.map(lineHtml).join('');
if(!session || session.user.is_anonymous){
 box.innerHTML=`<div class="cart"><div>${cartItems}</div><section class="card"><h2 class="checkout-title">Sign in to check out</h2><p class="help">Your items will stay in your cart while you sign in.</p><a class="btn dark" href="account.html?checkout=1">Sign in</a></section></div>`;
 return;
}
const metadata=session.user.user_metadata || {};
const c=draft || {name:metadata.full_name || metadata.name, ...metadata.delivery};
box.innerHTML=`<form class="cart checkout-layout" id="co" novalidate>
<div class="checkout-items">
<div>${cartItems}</div>
<section class="card checkout-details" aria-labelledby="checkout-details-heading">
<h2 class="checkout-title" id="checkout-details-heading">Contact and delivery</h2>
<div class="checkout-contact">
<label class="field"><span>Full name</span><input class="in" name="name" autocomplete="name" maxlength="100" value="${esc(c.name||'')}" placeholder="Your name"></label>
<label class="field"><span>Phone number</span><input class="in" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" value="${esc(c.phone||'')}" placeholder="+971 50 123 4567"></label>
</div>
<h3 class="checkout-title">Delivery address</h3>
${deliveryInputs(c)}
</section>
</div>
<section class="card checkout-summary" aria-labelledby="checkout-summary-heading">
${missing?'<p class="msg bad">Some items are no longer available. <button type="button" class="btn sm" id="remove-missing">Remove unavailable items</button></p>':''}<h2 class="checkout-title" id="checkout-summary-heading">Order summary</h2>
<div class="sum"><span class="muted">Items</span><span>${lines.reduce((n,l)=>n+l.quantity,0)}</span></div>
<label class="field"><span>Coupon code</span><div class="coupon-row"><input class="in" id="coupon" maxlength="32" value="${esc(coupon)}"><button class="btn" id="apply-coupon" type="button">Apply</button></div></label>
<div class="sum"><span>Subtotal</span><span>${money(total)}</span></div><div class="sum"><span>Discount</span><span>−${money(quote?.discount_total||0)}</span></div><div class="sum"><span>Delivery</span><span>${quote?money(quote.delivery_charge):'Unavailable'}</span></div><div class="sum t"><span>Total</span><span>${quote?money(quote.total):'Unavailable'}</span></div>${pricingError?`<p class="msg bad">${esc(pricingError)} <button class="btn" type="button" id="retry-cart">Retry</button></p>`:''}
<p class="help">Prices and stock are checked securely when you place your order. No online payment is needed.</p>
<div class="err" id="co-err" role="alert" hidden></div>
<button class="btn dark wide" type="submit" id="co-btn" ${blocked?'disabled':''}>Place order</button></section>
</form>`}
box.addEventListener('click',e=>{if(submitting)return;if(e.target.closest('#apply-coupon')){coupon=$('#coupon').value.trim().toUpperCase();render();return}if(e.target.closest('#retry-cart')){render();return}if(e.target.closest('#remove-missing')){Shop.cart.save(Shop.cart.get().filter(i=>lines.some(l=>l.product_id===i.product_id)));render();return}const row=e.target.closest('.cl');if(!row)return;const id=row.dataset.id;
const remove=e.target.closest('[data-rm]'),step=e.target.closest('[data-q]');
if(!remove&&(!step||step.disabled))return;
pendingCartEdits++;
const submit=$('#co-btn');if(submit)submit.disabled=true;
changeCartQuantity(id,remove?-Shop.cart.MAX_QUANTITY:Number(step.dataset.q))
  .catch(error=>toast(errMsg(error),'bad'))
  .finally(()=>{if(--pendingCartEdits===0)render()});});
box.addEventListener('submit',async e=>{e.preventDefault();if(submitting||refreshing||pendingCartEdits||e.target.id!=='co'||$('#co-btn').disabled)return;const f=e.target.elements,err=$('#co-err'),name=f.name.value.trim(),phone=f.phone.value.trim();err.hidden=true;
if(name.length<2){err.textContent='Please enter your name.';err.hidden=false;return}
if(phone.replace(/\D/g,'').length<6){err.textContent='Please enter a valid phone number.';err.hidden=false;return}
let address;
try { address=deliveryAddress(readDelivery(f)); }
catch(error) { err.textContent=error.message;err.hidden=false;return; }
const button=$('#co-btn');
submitting=true;
button.disabled=true;
const controls=[...box.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled);
controls.forEach(el=>el.disabled=true);

checkoutTitle.textContent='Processing your order…';
checkoutProcessing.hidden=false;
checkoutConfirmed.hidden=true;
checkoutCheck.hidden=true;
try {
  checkoutOverlay.showModal();
  const confirmedItems=lines.map(({product,quantity})=>({name:product.name,quantity,price:Number(product.selling_price)}));
  const order=await Shop.placeOrder({name,phone,address,coupon});
  // placeOrder already clears the cart after the server confirms the order.
  // Start redrawing the cart before showing the dismissible confirmation.
  draft=null;
  coupon='';
  box.replaceChildren();
  void render();
  $('#fzCheckoutThanks').textContent=`Thanks for your order, ${name}!`;
  checkoutSummary.textContent=`Your FZ Cart order #${order.order_number} is confirmed. We’ll get it ready for delivery.`;
  $('#fzCheckoutItems').replaceChildren(...confirmedItems.map(item=>{
    const row=document.createElement('li');
    row.textContent=`${item.quantity} × ${item.name} — ${money(item.quantity*item.price)}`;
    return row;
  }));
  $('#fzCheckoutTotal').textContent=`Total: ${money(order.total)}`;
  checkoutProcessing.hidden=true;
  checkoutCheck.hidden=false;
  checkoutTitle.textContent='Order Confirmed';
  checkoutConfirmed.hidden=false;
  checkoutTitle.focus();
} catch(ex) {
  checkoutOverlay.close();
  if(ex.code==='CHECKOUT_SIGN_IN'){await render();return}
  err.textContent=errMsg(ex);err.hidden=false;
} finally {
  submitting=false;
  if(button.isConnected) {
    button.disabled=false;
    controls.forEach(el=>el.disabled=false);
    if(!checkoutOverlay.open)button.focus();
  }
}
});
const checkoutOverlay=$('#fzCheckoutOverlay');
const checkoutTitle=$('#fzCheckoutTitle');
const checkoutProcessing=$('#fzCheckoutProcessing');
const checkoutConfirmed=$('#fzCheckoutConfirmed');
const checkoutCheck=$('#fzCheckoutCheck');
const checkoutSummary=$('#fzCheckoutSummary');
const checkoutDone=$('#fzCheckoutDoneBtn');
checkoutOverlay.addEventListener('cancel',event=>{if(submitting)event.preventDefault()});
checkoutDone.addEventListener('click',()=>checkoutOverlay.close());
checkoutOverlay.addEventListener('close',()=>{
  if(!checkoutConfirmed.hidden&&!checkoutOverlay.open)$('#main-content h1').focus();
});
window.addEventListener('pageshow',e=>{if(e.persisted&&!submitting)render()});
sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'&&!submitting)setTimeout(()=>{box.replaceChildren();draft=null;render()},0)});
window.addEventListener('storage',e=>{if(e.key===Shop.cart.KEY&&!submitting)render()});
applyBusinessSettings();render();
</script>
</body>
</html>
