<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your cart</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160D2B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="shop.css">
</head>
<body>
<div class="shell">
<div id="util"></div>
<header id="site-header"></header>
<main class="main" style="gap:18px">
<div class="page-h"><div class="sub">Step 1 of 2</div><h1>Your cart</h1></div>
<div id="cart"><div class="skel" style="min-height:160px"></div></div>
</main>
<footer id="site-footer"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1"></script>
<script src="supabase.js"></script>
<script src="shop.js"></script>
<script>
renderSiteHeader('cart');
const box=$('#cart');let lines=[];
const lineHtml=l=>{const p=l.product,im=(p.images||[])[0],o=stockOf(p)==='out';
return `<div class="cl" data-id="${esc(l.product_id)}">${im?`<img src="${esc(im)}" alt="${esc(p.name)}">`:`<div class="ph">${ic('box')}</div>`}<div class="info"><b>${esc(p.name)}</b><span class="small muted">${money(p.selling_price)} each</span>${o?'<div class="small" style="color:var(--bad);font-weight:600">Out of stock. Remove it to continue.</div>':''}<br><button class="rm" data-rm>Remove</button></div><div style="text-align:right"><div class="qty"><button data-q="-1" aria-label="Less">${ic('minus')}</button><span>${l.quantity}</span><button data-q="1" aria-label="More">${ic('plus')}</button></div><div class="price" style="margin-top:6px">${money(l.quantity*Number(p.selling_price))}</div></div></div>`};
function saved(){try{return JSON.parse(localStorage.getItem('cust_v1'))||{}}catch{return{}}}
async function render(){
let items=Shop.cart.get();
if(!items.length){box.innerHTML=emptyHtml('bag','Your cart is empty','Add something you like and it will wait here.','<a class="btn dark" href="products.html">Browse products</a>');return}
try{lines=await Shop.cartDetails()}catch(e){console.error(e);box.innerHTML=emptyHtml('alert','Could not load your cart','Refresh the page to try again.');return}
if(!lines.length){Shop.cart.clear();box.innerHTML=emptyHtml('bag','Your cart is empty','The products in it are no longer available.','<a class="btn dark" href="products.html">Browse products</a>');return}
const total=lines.reduce((s,l)=>s+l.quantity*Number(l.product.selling_price),0),blocked=lines.some(l=>stockOf(l.product)==='out'),c=saved();
box.innerHTML=`<div class="cart"><div>${lines.map(lineHtml).join('')}</div>
<form class="card" id="co" novalidate><h2 style="font-size:16px;margin-bottom:10px">Send your order</h2>
<div class="sum"><span class="muted">Items</span><span>${lines.reduce((n,l)=>n+l.quantity,0)}</span></div>
<div class="sum t"><span>Total</span><span>${money(total)}</span></div>
<p class="help">Final prices are confirmed when our team calls you. No online payment is needed.</p>
<label class="field"><span>Full name</span><input class="in" name="name" autocomplete="name" maxlength="100" value="${esc(c.name||'')}" placeholder="Your name"></label>
<label class="field"><span>Phone number</span><input class="in" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" value="${esc(c.phone||'')}" placeholder="+971 50 123 4567"></label>
<label class="field"><span>Delivery address (optional)</span><input class="in" name="address" autocomplete="street-address" maxlength="300" value="${esc(c.address||'')}" placeholder="Area, street, building"></label>
<div class="err" id="co-err" hidden></div>
<button class="btn dark wide" type="submit" id="co-btn" ${blocked?'disabled':''}>Place order</button></form></div>`}
box.addEventListener('click',e=>{const row=e.target.closest('.cl');if(!row)return;const id=row.dataset.id,cur=(Shop.cart.get().find(i=>i.product_id===id)||{}).quantity||0;
if(e.target.closest('[data-rm]')){Shop.cart.remove(id);render()}
const q=e.target.closest('[data-q]');if(q){Shop.cart.setQty(id,cur+Number(q.dataset.q));render()}});
box.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.elements,err=$('#co-err'),name=f.name.value.trim(),phone=f.phone.value.trim(),address=f.address.value.trim();err.hidden=true;
if(name.length<2){err.textContent='Please enter your name.';err.hidden=false;return}
if(phone.replace(/\D/g,'').length<6){err.textContent='Please enter a valid phone number.';err.hidden=false;return}
await withBusy($('#co-btn'),async()=>{try{await Shop.placeOrder({name,phone,address});try{localStorage.setItem('cust_v1',JSON.stringify({name,phone,address}))}catch{}location.href='orders.html#placed'}catch(ex){err.textContent=errMsg(ex);err.hidden=false}})});
window.addEventListener('settings-loaded',()=>{});
applyBusinessSettings();render();
</script>
</body>
</html>
